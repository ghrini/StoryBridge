<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&family=Pacifico&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #eef3fb; color: #3a3542; font-family: "Outfit", system-ui, sans-serif; font-weight: 400; text-wrap: pretty; -webkit-font-smoothing: antialiased; }
a { color: #1f93b5; }
a:hover { color: #7a35a3; }
:focus-visible { outline: 2px solid #23a3c6; outline-offset: 3px; }
</style>
</helmet>
<div style="padding:0;">
  <section style="margin:0; border-radius:0; background:linear-gradient(180deg, rgba(255,0,128,0.1) 0%, rgba(255,0,128,0.14) 45%, rgba(255,0,128,0.2) 75%, rgba(255,0,128,0.2) 100%), linear-gradient(180deg, rgba(40,18,60,0.12) 0%, rgba(40,18,60,0.10) 50%, rgba(30,16,60,0.5) 100%), url('./assets/hero-hills.svg?v=3') center 62%/cover no-repeat; background-blend-mode:saturation, normal, normal; color:#fff; padding:0 clamp(20px,4.5vw,64px) clamp(40px,5vw,64px); box-sizing:border-box; position:relative; overflow:visible;">
    <header style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px 24px; padding:22px 0;">
      <a href="SmileCard%20Home%20v7.dc.html" style="display:flex; align-items:center; gap:8px; text-decoration:none;">
        <svg viewBox="0 0 100 100" width="56" height="56" aria-hidden="true" style="display:block; flex-shrink:0;">
          <g transform="rotate(-14 38 52)"><rect x="18" y="24" width="38" height="58" rx="3" fill="#8e3fb5"></rect><rect x="21.5" y="27.5" width="31" height="51" rx="2" fill="#fff"></rect><path d="M27 40 q3 -3.5 6 0 M38 40 q3 -3.5 6 0" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"></path><ellipse cx="27.5" cy="45" rx="3" ry="1.8" fill="#f6b3cf"></ellipse><ellipse cx="44" cy="45" rx="3" ry="1.8" fill="#f6b3cf"></ellipse></g>
          <g transform="rotate(13 62 50)"><rect x="43" y="20" width="38" height="60" rx="3" fill="#2f6fd6"></rect><rect x="46.5" y="23.5" width="31" height="53" rx="2" fill="#fff"></rect><circle cx="55" cy="36" r="4.6" fill="#111"></circle><circle cx="69" cy="36" r="4.6" fill="#111"></circle><circle cx="56.6" cy="34.4" r="1.6" fill="#fff"></circle><circle cx="70.6" cy="34.4" r="1.6" fill="#fff"></circle><path d="M59.5 43 q2.5 2.2 5 0" fill="none" stroke="#222" stroke-width="1.4" stroke-linecap="round"></path><path d="M62 71 C49 63 50 52 56 52.5 C59.5 52.8 61.5 55.5 62 57.5 C62.5 55.5 64.5 52.8 68 52.5 C74 52 75 63 62 71 Z" fill="none" stroke="#8e3fb5" stroke-width="1.6" stroke-linejoin="round"></path></g>
          <text x="10" y="21" transform="rotate(-10 10 21)" font-family="Patrick Hand, cursive" font-size="17" fill="#fff">Smile</text>
          <text x="55" y="97" transform="rotate(-6 55 97)" font-family="Patrick Hand, cursive" font-size="17" fill="#fff">Card</text>

        <span style="font-family:Pacifico, cursive; font-size:26px; color:#fff; line-height:1; padding-bottom:4px; text-shadow:0 2px 12px rgba(60,20,80,0.3);">SmileCard</span>
      </a>
      <nav style="display:flex; flex-wrap:wrap; justify-content:center; gap:0 clamp(4px,1.4vw,20px); align-items:center;">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <div style="position:relative; z-index:20;" onMouseEnter="{{ n.open }}" onMouseLeave="{{ closeMenu }}">
            <a href="{{ n.href }}" style="{{ n.style }}">{{ n.label }}</a>
            <sc-if value="{{ n.isOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute; top:100%; left:0; min-width:230px; background:#fff; border-radius:16px; box-shadow:0 14px 36px rgba(80,40,120,0.18); padding:8px; display:grid;">
                <sc-for list="{{ n.items }}" as="s" hint-placeholder-count="3">
                  <a href="{{ s.href }}" style="color:#3a3542; text-decoration:none; font-size:15px; font-weight:500; padding:11px 14px; border-radius:10px;" style-hover="background:#e6ecf8; color:#7a35a3;">{{ s.label }}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </nav>
    </header>
    <div style="display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:24px; padding-top:clamp(40px,7vw,96px);">
      <div data-reveal="0" style="display:flex; flex-direction:column; gap:18px; max-width:760px;">
        <span style="font-size:13px; font-weight:500; letter-spacing:0.16em; text-transform:uppercase; color:#fff;">{{ kicker }}</span>
        <h1 style="margin:0; font-weight:400; line-height:1.08; text-shadow:0 4px 30px rgba(70,20,90,0.25);">
          <span style="display:block; font-family:'Instrument Serif', serif; font-style:italic; font-size:clamp(48px,7vw,104px); letter-spacing:-0.02em;">{{ title }}</span>
          <span style="display:block; font-family:Outfit, sans-serif; font-weight:300; font-size:clamp(30px,4.2vw,62px); letter-spacing:-0.035em; margin-top:0.16em;">{{ subtitle }}</span>
        </h1>
        <sc-if value="{{ intro }}" hint-placeholder-val="{{ true }}">
          <p style="margin:6px 0 0; font-size:clamp(16px,1.4vw,18.5px); line-height:1.65; font-weight:300; color:rgba(255,255,255,0.94); max-width:60ch;">{{ intro }}</p>
        </sc-if>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SmileCard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Card Gallery&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;free to download&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;gallery&quot;,&quot;volunteer&quot;,&quot;team&quot;,&quot;more&quot;],&quot;default&quot;:&quot;gallery&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menu: null };
  componentDidMount() { setTimeout(() => this.startMotion(), 250); }
  startMotion() {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    let pending = [];
    const prep = () => document.querySelectorAll('[data-reveal]').forEach(el => {
      if (el.__rv) return; el.__rv = 1;
      const d = +el.getAttribute('data-reveal') || 0;
      el.style.opacity = 0; el.style.transform = 'translateY(26px)';
      el.style.transition = 'opacity .85s ease ' + d + 'ms, transform .85s cubic-bezier(.2,.7,.2,1) ' + d + 'ms';
      pending.push(el);
    });
    const check = () => {
      prep();
      const vh = window.innerHeight;
      pending = pending.filter(el => {
        const r = el.getBoundingClientRect();
        if (r.top < vh * 0.94) { el.style.opacity = 1; el.style.transform = 'none'; return false; }
        return true;
      });
    };
    requestAnimationFrame(() => requestAnimationFrame(check));
    setTimeout(check, 800);
    let mt;
    new MutationObserver(() => { clearTimeout(mt); mt = setTimeout(check, 60); }).observe(document.body, { childList: true, subtree: true });
    document.addEventListener('scroll', check, { passive: true, capture: true });
    document.querySelectorAll('[data-bob]').forEach((el, i) => el.animate(
      [{ transform: 'translateY(0) rotate(0deg)' }, { transform: 'translateY(-6px) rotate(' + (i % 2 ? 3 : -3) + 'deg)' }],
      { duration: 2200 + (i % 3) * 400, delay: i * 180, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' }));
  }
  char(young, w) {
    const h = React.createElement;
    const ht = Math.round(w * 62 / 46);
    return h('svg', { viewBox: '0 0 46 62', width: w, height: ht, style: { display: 'block', overflow: 'visible' } },
      h('rect', { x: 0, y: 0, width: 46, height: 62, rx: 5, fill: young ? '#c0399f' : '#2f6fd6' }),
      h('rect', { x: 3.5, y: 3.5, width: 39, height: 55, rx: 3, fill: '#fff' }),
      young
        ? [h('path', { key: 'h', d: 'M3.5 16 C6 6 14 4 23 6 C32 4 40 6 42.5 16 L42.5 6.5 Q42.5 3.5 39.5 3.5 L6.5 3.5 Q3.5 3.5 3.5 6.5 Z', fill: '#5a3426' }), h('path', { key: 'b', d: 'M33 6 l-6 -5 v10 Z M33 6 l6 -5 v10 Z', fill: '#ff6fb3' }), h('circle', { key: 'k', cx: 33, cy: 6, r: 1.8, fill: '#e0479a' })]
        : [8, 15, 23, 31, 38].map((x, i) => h('circle', { key: 'c' + i, cx: x, cy: 7 + (i % 2), r: 5.2, fill: '#d7d6de' })),
      h('ellipse', { cx: 11, cy: 32, rx: 3.4, ry: 2, fill: '#f6b3cf' }),
      h('ellipse', { cx: 35, cy: 32, rx: 3.4, ry: 2, fill: '#f6b3cf' }),
      young ? null : [h('circle', { key: 'g1', cx: 15, cy: 24, r: 6, fill: 'rgba(200,225,255,0.25)', stroke: '#6b4f9e', strokeWidth: 1.4 }), h('circle', { key: 'g2', cx: 31, cy: 24, r: 6, fill: 'rgba(200,225,255,0.25)', stroke: '#6b4f9e', strokeWidth: 1.4 }), h('path', { key: 'gb', d: 'M21 23.5 q2 -1.6 4 0', fill: 'none', stroke: '#6b4f9e', strokeWidth: 1.4 })],
      h('path', { d: 'M11 25 q4 -5 8 0 M27 25 q4 -5 8 0', fill: 'none', stroke: '#222', strokeWidth: 2, strokeLinecap: 'round' }),
      h('path', { d: 'M16 34 q7 9 14 0 Z', fill: '#222', stroke: '#222', strokeWidth: 1.4, strokeLinejoin: 'round' }),
      h('path', { d: 'M23 54 C15 49 16 42 19.5 42.3 C21.5 42.5 22.7 44 23 45.3 C23.3 44 24.5 42.5 26.5 42.3 C30 42 31 49 23 54 Z', fill: 'none', stroke: young ? '#c0399f' : '#2f6fd6', strokeWidth: 1.4 })
    );
  }
  renderVals() {
    const h = React.createElement;
    const b = 'https://www.smilecard.org';
    const cur = this.props.current || '';
    const menus = [
      { id: 'home', label: 'Home', href: 'SmileCard%20Home%20v7.dc.html' },
      { id: 'gallery', label: 'Card Gallery ▾', href: 'Card%20Gallery.dc.html', items: [['Recent Cards', b + '/new-cards'], ['All Cards', b + '/all-cards'], ["Jacob's Heart", b + '/trinity-school']] },
      { id: 'volunteer', label: 'Volunteer', href: 'Volunteer%20Opportunities.dc.html' },
      { id: 'team', label: 'Our Team', href: 'Our%20Team.dc.html' },
      { id: 'storybridge', label: 'StoryBridge', href: '../' },
      { id: 'more', label: 'More ▾', href: '#', items: [['Beneficiaries', 'Beneficiaries.dc.html'], ['Volunteers', 'Volunteers.dc.html'], ['Senior Loneliness Awareness', 'Senior%20Loneliness%20Awareness.dc.html'], ['Testimonials', 'Testimonials.dc.html']] },
    ];
    const nav = menus.map((m, i) => ({
      label: m.label, href: m.href,
      style: { display: 'block', color: '#fff', textDecoration: 'none', fontSize: 15, fontWeight: 500, padding: '8px 12px', borderRadius: 999, whiteSpace: 'nowrap', background: cur === m.id ? 'rgba(255,255,255,0.22)' : 'transparent' },
      items: (m.items || []).map(([label, href]) => ({ label, href })),
      isOpen: !!m.items && this.state.menu === i,
      open: () => this.setState({ menu: i }),
    }));
    const duo = h('div', { 'aria-hidden': true, style: { display: 'flex', alignItems: 'flex-end', gap: 6, filter: 'drop-shadow(0 10px 18px rgba(30,10,60,0.35))' } },
      h('div', { 'data-bob': '', style: { transform: 'rotate(-7deg)' } }, this.char(true, 58)),
      h('div', { 'data-bob': '', style: { transform: 'rotate(7deg)' } }, this.char(false, 58)));
    return {
      nav, duo,
      kicker: this.props.kicker ?? '', title: this.props.title ?? '', subtitle: this.props.subtitle ?? '', intro: this.props.intro ?? '',
      closeMenu: () => this.setState({ menu: null }),
    };
  }
}
</script>
</body>
</html>
