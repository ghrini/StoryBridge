<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>SmileCard</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&family=Pacifico&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #eef3fb; color: #3a3542; font-family: "Outfit", system-ui, sans-serif; text-wrap: pretty; -webkit-font-smoothing: antialiased; }
a { color: #1f93b5; }
a:hover { color: #7a35a3; }
</style>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#8e3fb5"></rect><rect x="34" y="28" width="32" height="44" rx="4" fill="#fff"></rect><path d="M42 44 q3 -3 6 0 M52 44 q3 -3 6 0 M43 54 q7 7 14 0" fill="none" stroke="#2b2632" stroke-width="2.5" stroke-linecap="round"></path></svg></template>
</helmet>
<dc-import name="PageHero" current="team" kicker="Our team" title="The people" subtitle="behind every smile" intro="" hint-size="100%,460px"></dc-import>

<div style="padding:0 clamp(10px,2vw,24px);">
  <section style="max-width:1320px; margin:clamp(10px,2vw,24px) auto 0; border-radius:32px; background:#fff; padding:clamp(48px,6vw,88px) clamp(20px,4.5vw,64px); box-sizing:border-box; display:grid; gap:48px;">
    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(24px,3vw,40px);">
      <sc-for list="{{ people }}" as="p" hint-placeholder-count="5">
        <div data-reveal="{{ p.delay }}" style="flex:0 1 140px; display:grid; gap:14px; justify-items:center; text-align:center;">
          <div style="width:128px; height:128px; border-radius:50%; overflow:hidden; background:{{ p.tint }}; box-shadow:0 0 0 6px #fff, 0 0 0 7px #c9d9f2; display:flex; align-items:center; justify-content:center; transition:transform .35s cubic-bezier(.2,.8,.2,1);" style-hover="transform:translateY(-6px) rotate(-2deg);">
            <sc-if value="{{ p.hasPhoto }}" hint-placeholder-val="{{ false }}">
              <div role="img" aria-label="{{ p.name }}" style="width:100%; height:100%; background:{{ p.bg }} center/cover no-repeat;"></div>
            </sc-if>
            <sc-if value="{{ p.noPhoto }}" hint-placeholder-val="{{ true }}">
              <span style="font-family:'Instrument Serif', serif; font-style:italic; font-size:52px; line-height:1; color:#fff;">{{ p.initial }}</span>
            </sc-if>
          </div>
          <div style="display:grid; gap:4px;">
            <h3 style="margin:0; font-size:21px; font-weight:500; color:#2b2632;">{{ p.name }}</h3>
            <span style="font-size:13px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:{{ p.color }};">{{ p.role }}</span>
          </div>
        </div>
      </sc-for>
    </div>
    <a data-reveal="0" href="https://docs.google.com/forms/d/e/1FAIpQLSe0DadkBOv3818imOohA_6HN0FYnl5l1hwfINbETkO3Gfc3Wg/viewform" style="justify-self:center; background:#2b2632; color:#fff; text-decoration:none; font-size:15px; font-weight:500; padding:16px 28px; border-radius:999px; transition:transform .2s ease, background .2s ease;" style-hover="transform:translateY(-2px); background:#7a35a3; color:#fff;">Click to see which leadership positions are open ↗</a>
  </section>
</div>

<dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const img = id => (window.__scR || (u => u))('https://static.wixstatic.com/media/' + id + '/v1/fill/w_300,h_300,q_85/i.' + id.split('.').pop());
    const list = [
      ['Ghrini Sai Jella', 'President', '#c0399f', '634fd7_c53855e9c58840d5a0452bfca4c9c7f4~mv2.jpg'],
      ['Nandini', 'Vice President', '#2f6fd6'],
      ['Jay', 'Marketing', '#7a35a3'],
      ['Diya', 'Marketing', '#7a35a3'],
      ['Vaibhav', 'Outreach Coordinator', '#1b7d9a'],
    ];
    return {
      people: list.map(([name, role, color, id], i) => ({
        name, role, color, initial: name[0], tint: color,
        hasPhoto: !!id, noPhoto: !id, bg: id ? 'url(' + img(id) + ')' : 'none', delay: i * 100,
      })),
    };
  }
}
</script>
</body>
</html>
